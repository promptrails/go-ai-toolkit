version: 2

builds:
  - main: ./cmd/chat
    id: ai-chat
    binary: ai-chat
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "ai-chat_{{ .Os }}_{{ .Arch }}"

brews:
  - name: ai-chat
    repository:
      owner: promptrails
      name: homebrew-tap
    homepage: https://github.com/promptrails/go-ai-toolkit
    description: AI chat TUI powered by Go AI Toolkit (LangRails + GuardRails + MemoryRails)

changelog:
  sort: asc
